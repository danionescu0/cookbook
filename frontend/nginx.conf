server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router owns every client-side route (/account, /backoffice,
    # /en/recipes/26-..., etc.) and only ever renders through index.html. Without this, nginx
    # looks for a literal file/directory at the requested path and 404s on any direct
    # navigation or refresh that isn't "/" — clicking a link inside the already-loaded app never
    # hits this, since that's client-side routing, which is why it went unnoticed until someone
    # refreshed a deep link. Real static files (JS/CSS bundles, favicon, ...) are matched first
    # and served normally; only a path with no matching file falls through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
